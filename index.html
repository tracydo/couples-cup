@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800;900&family=Rubik:wght@400;500;600;700&display=swap');

.cl {
  --bg: #F2F6FC;
  --card: #FFFFFF;
  --card-2: #FFFFFF;
  --ink: #141A33;
  --muted: #5D6784;
  --faint: #9AA3B9;
  --hair: #E4E9F2;
  --ring: #A6AFC4;
  --dash: #C8CFDD;
  --pill-bg: #141A33;
  --pill-fg: #FFFFFF;
  --on-sun: #141A33;
  --ticket: #FFF7D6;
  --tag-pink: #B0265F;
  --lead-bg: #FFFBEA;
  --lead-glow: #FFE58A;
  --live-bg: #FFE8E8;
  --live-fg: #C62828;
  --ind-bg: #E1EAFF;
  --ind-fg: #1F4FD1;
  --pair-bg: rgba(255, 255, 255, 0.75);
  --turf: #16934F;
  --turf-deep: #0B6B39;
  --sun: #FFD23F;
  --pink: #FFE0EC;
  --rose: #D93A48;
  --mint: #0E8A55;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --r-lg: 10px;
  --r-md: 8px;
  --r-sm: 6px;
  --r-xs: 4px;
  --display: Unbounded, Rubik, system-ui, sans-serif;
  font-family: Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  color-scheme: light;
  transition: background-color 0.35s ease, color 0.35s ease;
}
.cl *, .cl *::before, .cl *::after { box-sizing: border-box; }
.cl-wrap { max-width: 900px; margin: 0 auto; padding: 24px 18px 80px; }
.cl-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.cl button:focus-visible, .cl input:focus-visible { outline: 3px solid #2F6BFF; outline-offset: 3px; }

.cl-card { background: var(--card); border-radius: var(--r-lg); margin-bottom: 18px; box-shadow: 0 1px 0 var(--hair); }
.cl-pad { padding: 22px; }
.cl-h2 { margin: 0 0 10px; font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
.cl-sub { margin: 4px 0 0; font-size: 14px; color: var(--muted); max-width: 70ch; }

/* ---------- Hero: the field ---------- */
.cl-hero {
  position: relative; overflow: hidden; isolation: isolate;
  padding: 28px 26px 30px; border-radius: var(--r-lg); color: #fff;
  background:
    radial-gradient(110% 90% at 100% 0%, rgba(62, 214, 124, 0.55) 0%, transparent 55%),
    linear-gradient(160deg, var(--turf) 0%, var(--turf-deep) 100%);
  box-shadow: 0 24px 48px -28px rgba(11, 107, 57, 0.9);
}
.cl-hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.11) 0 2px, transparent 2px 74px);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 35%, #000);
  mask-image: linear-gradient(180deg, transparent, #000 35%, #000);
}
.cl-kicker {
  display: inline-block; margin: 0; padding: 5px 12px; border-radius: var(--r-sm);
  background: rgba(255, 255, 255, 0.16); font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.cl-h1 {
  margin: 14px 0 14px; max-width: 11ch;
  font-family: var(--display); font-weight: 800;
  font-size: clamp(44px, 10.5vw, 92px); line-height: 0.95; letter-spacing: -0.035em; color: #fff;
  text-shadow: 0 5px 0 rgba(8, 70, 37, 0.55);
}
.cl-lede { margin: 0; font-size: 17px; font-weight: 500; max-width: 50ch; color: rgba(255, 255, 255, 0.95); }
.cl-updated {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 16px 0 0; padding: 6px 12px 6px 10px; border-radius: var(--r-sm);
  background: var(--sun); color: var(--on-sun); font-size: 13px; font-weight: 600;
}
.cl-updated::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--on-sun); }
.cl-refresh {
  margin-left: 4px; padding: 4px 10px; border: 0; border-radius: var(--r-xs);
  background: rgba(0, 0, 0, 0.14); color: inherit; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
}
.cl-refresh:disabled { opacity: 0.6; cursor: default; }
.cl-offline { margin: 10px 0 0; font-size: 13px; font-weight: 500; color: #FFE9A8; }
.cl-ball {
  position: absolute; top: 20px; right: 24px; font-size: 54px; line-height: 1;
  filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.3));
  animation: cl-kick 1.2s cubic-bezier(0.2, 0.9, 0.25, 1) 0.15s both;
  transition: transform 0.5s var(--spring);
}
.cl-hero:hover .cl-ball { transform: rotate(-18deg) translateY(-4px); }
@keyframes cl-kick {
  0% { transform: translate(-720px, 120px) rotate(-1000deg) scale(0.5); opacity: 0; }
  12% { opacity: 1; }
  100% { transform: none; opacity: 1; }
}

.cl-winner {
  position: relative; display: flex; align-items: center; gap: 16px; margin: 0 0 18px; padding: 16px 44px 16px 18px;
  border-radius: var(--r-lg); background: var(--card);
  box-shadow: 0 0 0 2px var(--c), 0 18px 34px -26px var(--c);
  animation: cl-pop-in 0.6s var(--spring) both;
}
@keyframes cl-pop-in { from { opacity: 0; transform: translateY(-10px) scale(0.97); } to { opacity: 1; transform: none; } }
.cl-winner-faces { display: inline-flex; padding: 0; border: 0; background: none; cursor: pointer; }
.cl-winner-faces .cl-av + .cl-av { margin-left: -14px; }
.cl-winner-copy { min-width: 0; }
.cl-winner-kicker { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.cl-winner-name { margin: 2px 0 4px; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.15; letter-spacing: -0.02em; }
.cl-winner-pts { margin: 0; font-size: 14px; color: var(--muted); }
.cl-winner-x {
  position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border: 0; border-radius: var(--r-xs);
  background: var(--bg); color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer;
}
@media (max-width: 600px) {
  .cl-winner { gap: 12px; padding: 14px 40px 14px 14px; }
  .cl-winner-name { font-size: 17px; }
}

/* ---------- Tabs: sliding pill ---------- */
.cl-tabs {
  position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr);
  margin: 22px 0 22px; padding: 5px; border-radius: var(--r-md); background: var(--card); box-shadow: 0 1px 0 var(--hair);
}
.cl-tab-ind {
  position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / var(--n));
  border-radius: var(--r-sm); background: var(--pill-bg);
  transform: translateX(calc(var(--i) * 100%)); transition: transform 0.5s var(--spring);
}
.cl-tab {
  position: relative; z-index: 1; padding: 11px 8px; border: 0; border-radius: var(--r-sm); background: transparent;
  color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: color 0.25s ease;
}
.cl-tab[aria-selected="true"] { color: var(--pill-fg); }
.cl-tab { transition: color 0.25s ease, transform 0.3s var(--spring); }
.cl-tab:active { transform: scale(0.95); }
.cl-tab-short { display: none; }

.cl-view { animation: cl-rise 0.35s var(--spring); }
@keyframes cl-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- Avatars ---------- */
.cl-av {
  display: inline-grid; place-items: center; flex: 0 0 auto; border-radius: 50%;
  background: var(--c); color: var(--fg); font-weight: 700; line-height: 1;
  box-shadow: 0 0 0 2.5px var(--card);
}
.cl-av.is-photo { display: inline-block; object-fit: cover; border: 2px solid var(--c); background: var(--c); }
.cl-duo { position: relative; display: inline-flex; flex: 0 0 auto; }
.cl-duo .cl-av + .cl-av { margin-left: -8px; transition: transform 0.4s var(--spring); }
.cl-duo-heart {
  position: absolute; left: 50%; bottom: -6px; font-size: 12px; line-height: 1;
  transform: translateX(-50%); transition: transform 0.4s var(--spring);
}
.cl-who { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }


/* ---------- The kiss ---------- */
/* At rest the pair sits side by side. On hover or tap they lean in, heads tilted, and a kiss pops up where they meet. */
.cl-duo.is-kiss .cl-av + .cl-av { margin-left: 3px; }
.cl-duo.is-kiss .cl-av { position: relative; transform-origin: 50% 85%; transition: transform 0.5s var(--spring); }
.cl-duo.is-kiss .cl-av:nth-child(1) { z-index: 2; }
.cl-duo.is-kiss .cl-duo-heart { transition: transform 0.3s ease, opacity 0.2s ease; }
.cl-kiss {
  position: absolute; left: 50%; top: -12px; z-index: 3; font-size: 17px; line-height: 1; pointer-events: none;
  opacity: 0; transform: translate(-50%, 8px) scale(0.2) rotate(-20deg);
  transition: opacity 0.15s ease, transform 0.25s ease;
}
.cl-board-row:hover .cl-duo.is-kiss .cl-av:nth-child(1),
.cl-board-row:active .cl-duo.is-kiss .cl-av:nth-child(1) { transform: rotate(18deg) scale(1.04); }
.cl-board-row:hover .cl-duo.is-kiss .cl-av:nth-child(2),
.cl-board-row:active .cl-duo.is-kiss .cl-av:nth-child(2) { transform: rotate(-18deg) scale(1.04); }
.cl-board-row:hover .cl-duo.is-kiss .cl-duo-heart,
.cl-board-row:active .cl-duo.is-kiss .cl-duo-heart { opacity: 0; transform: translate(-50%, 6px) scale(0.5); }
.cl-board-row:hover .cl-kiss,
.cl-board-row:active .cl-kiss {
  opacity: 1; transform: translate(-50%, 0) scale(1) rotate(0deg);
  transition: opacity 0.15s ease 0.18s, transform 0.5s var(--spring) 0.18s;
}

/* ---------- Couples Cup leaderboard ---------- */
.cl-board { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.cl-board-row {
  position: relative; display: grid; grid-template-columns: auto 1fr auto; column-gap: 14px; row-gap: 14px; align-items: center;
  padding: 18px 20px 16px; border-radius: var(--r-lg);
  background: radial-gradient(90% 140% at 100% 0%, var(--soft) 0%, transparent 55%), var(--card);
  box-shadow: 0 1px 0 var(--hair), 0 18px 30px -26px var(--c);
  transition: transform 0.35s var(--spring), box-shadow 0.35s ease;
}
.cl-board-row.is-lead {
  background: radial-gradient(90% 140% at 100% 0%, var(--lead-glow) 0%, transparent 60%), var(--lead-bg);
  box-shadow: 0 0 0 2px var(--sun), 0 22px 36px -24px rgba(214, 160, 0, 0.8);
}
@media (hover: hover) {
  .cl-board-row:hover { transform: translateY(-3px) rotate(-0.4deg); box-shadow: 0 1px 0 var(--hair), 0 26px 40px -24px var(--c); }
}
.cl-trophy { margin-left: 8px; font-size: 18px; }
.cl-board-main { min-width: 0; }
.cl-pts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.cl-live {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: var(--r-xs);
  background: var(--live-bg); color: var(--live-fg); font-size: 12px; font-weight: 600;
}
.cl-live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #FF4545; }
.cl-board-names { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.cl-board-rec { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -0.03em; line-height: 1; }
.cl-board-strip { grid-column: 2 / -1; }

.cl-strip {
  display: grid; grid-template-columns: repeat(14, minmax(40px, 1fr)); gap: 4px; max-width: 620px;
  overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
}
.cl-strip::-webkit-scrollbar { display: none; }
.cl-strip-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cl-strip-pts { font-size: 9.5px; font-weight: 700; line-height: 1.1; min-height: 12px; letter-spacing: -0.02em; }
.cl-strip-pts.is-live { color: var(--muted); }
.cl-strip-wk { font-size: 10px; font-weight: 500; color: var(--muted); }

.cl-pair { display: inline-flex; gap: 3px; padding: 3px 4px; border-radius: var(--r-xs); vertical-align: middle; }
.cl-pair.is-partners { background: var(--pink); }
.cl-pip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2px var(--ring); }
.cl-pip.pip-W { background: var(--c, var(--turf)); box-shadow: none; }
.cl-pip.pip-T { background: linear-gradient(90deg, var(--c, var(--turf)) 50%, var(--card) 50%); box-shadow: inset 0 0 0 1.5px var(--c, var(--turf)); }
.cl-pip.pip-none { background: transparent; box-shadow: none; border: 1.5px dashed var(--dash); }

.cl-legend { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 16px; padding: 4px 6px; font-size: 13px; color: var(--muted); }
.cl-legend > span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Week picker ---------- */
.cl-weeks { display: flex; gap: 8px; overflow-x: auto; padding: 6px 4px 10px; margin: 0 -4px 6px; scrollbar-width: none; }
.cl-weeks::-webkit-scrollbar { display: none; }
.cl-wk {
  position: relative; flex: 0 0 auto; width: 42px; height: 42px; border-radius: var(--r-md); border: 0;
  background: var(--card); color: var(--ink); box-shadow: 0 1px 0 var(--hair);
  font-family: var(--display); font-weight: 700; font-size: 14px; cursor: pointer;
  transition: transform 0.35s var(--spring), background-color 0.2s ease, color 0.2s ease;
}
.cl-wk.is-upcoming { color: var(--faint); }
.cl-wk.is-live::after {
  content: ""; position: absolute; top: 1px; right: 1px; width: 10px; height: 10px;
  border-radius: 50%; background: #FF4545; box-shadow: 0 0 0 2px var(--bg);
}
.cl-wk:active { transform: scale(0.9); }
.cl-wk[aria-pressed="true"] { background: var(--turf); color: #fff; transform: scale(1.1); box-shadow: 0 8px 16px -8px rgba(11, 107, 57, 0.8); }

.cl-status {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; padding: 7px 14px; border-radius: var(--r-sm);
  background: var(--card); font-size: 14px; font-weight: 500; box-shadow: 0 1px 0 var(--hair);
}
.cl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dash); }
.cl-dot.is-live { background: #FF4545; box-shadow: 0 0 0 4px rgba(255, 69, 69, 0.18); }
.cl-dot.is-final { background: var(--turf); }

/* ---------- Bet slips ---------- */
.cl-ticket {
  display: flex; gap: 12px; align-items: center; margin: 4px 0 18px; padding: 12px 16px 12px 12px;
  background: var(--ticket); border-radius: var(--r-md); font-size: 15px;
}
.cl-ticket p { margin: 0; max-width: 68ch; }
.cl-ticket-emoji {
  display: grid; place-items: center; flex: 0 0 auto; width: 38px; height: 38px; border-radius: var(--r-sm);
  background: var(--card); font-size: 19px; line-height: 1;
}

/* ---------- Matchups ---------- */
.cl-games { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.cl-game {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding: 6px; border-radius: var(--r-md); background: var(--bg);
}
.cl-game.is-partners { background: var(--pink); }
.cl-side {
  display: flex; align-items: center; gap: 10px; min-width: 0; padding: 8px 10px; border-radius: var(--r-sm);
  transition: background-color 0.3s ease;
}
.cl-side.is-right { flex-direction: row-reverse; text-align: right; }
.cl-side.is-win { background: var(--card-2); box-shadow: 0 10px 20px -16px var(--c); }
.cl-gname { flex: 1; min-width: 0; font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl-side.is-win .cl-gname { font-weight: 700; }
.cl-gscore { font-family: var(--display); font-weight: 700; font-size: 15px; padding: 3px 9px; border-radius: var(--r-xs); color: var(--muted); }
.cl-side.is-win .cl-gscore { background: var(--c); color: var(--fg); }
.cl-gnums { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.cl-side.is-right .cl-gnums { align-items: flex-start; }
.cl-gproj { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.cl-cplnums { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.cl-vs { font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: 0.02em; }
.cl-tag {
  display: inline-block; margin-left: 8px; padding: 3px 10px; border-radius: var(--r-xs);
  background: var(--card); color: var(--tag-pink); font-size: 12px; font-weight: 600; vertical-align: middle; white-space: nowrap;
}
.cl-game .cl-tag { grid-column: 1 / -1; justify-self: center; margin: 0 0 4px; }

/* ---------- Couples this week ---------- */
.cl-cplweek { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cl-cplrow {
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: var(--r-md); background: var(--soft);
}
.cl-cplrow .cl-tag { background: var(--card); }
.cl-cplname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.cl-cplpts { font-family: var(--display); font-weight: 700; font-size: 15px; }
.cl-cplres { display: inline-flex; align-items: center; gap: 6px; }
.cl-cplres .cl-pair { background: var(--pair-bg); }
.cl-listnote { margin: -6px 0 12px; font-size: 13px; color: var(--muted); }
.cl-res.is-prior { color: var(--muted); font-weight: 600; }
.cl-res { display: inline-block; min-width: 34px; font-weight: 700; text-align: right; }

/* ---------- Tables ---------- */
.cl-table { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 8px; }
.cl-table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px 10px 0; border-bottom: 1px solid var(--hair); }
.cl-table td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--hair); }
.cl-table tr:last-child td { border-bottom: 0; }
.cl-table .num { text-align: right; white-space: nowrap; }
.cl-table tbody tr { transition: background-color 0.2s ease; }
@media (hover: hover) { .cl-table tbody tr:hover { background: var(--bg); } }
.cl-table tr.is-cut td { border-bottom: 2px dashed var(--turf); }
.cl-standrank { font-family: var(--display); font-weight: 700; color: var(--muted); }
.cl-strong { font-weight: 700; }

/* ---------- Money ---------- */
.cl-prizes { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 6px; }
.cl-prize {
  display: flex; flex-direction: column; gap: 3px; padding: 16px 18px; border-radius: var(--r-md);
  transition: transform 0.4s var(--spring);
}
@media (hover: hover) { .cl-prize:hover { transform: translateY(-4px) rotate(-2deg); } }
.cl-prize-emoji { font-size: 28px; line-height: 1.1; margin-bottom: 4px; }
.cl-prize-amt { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -0.03em; line-height: 1.1; }
.cl-prize-label { font-weight: 600; font-size: 14px; }
.cl-prize-sub { font-size: 13px; color: var(--muted); }

.cl-h3 { margin: 18px 0 8px; font-size: 14px; font-weight: 700; color: var(--muted); }
.cl-owedtotal { margin: 12px 0 14px; font-family: var(--display); font-weight: 700; font-size: 17px; }
.cl-settle { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cl-settle-row {
  display: grid; grid-template-columns: 1fr auto 1fr auto; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--r-md); background: var(--bg);
}
.cl-settle-arrow { color: var(--muted); font-weight: 700; }
.cl-settle-amt { font-family: var(--display); font-weight: 700; font-size: 16px; }
@media (max-width: 600px) {
  .cl-settle-row { grid-template-columns: 1fr auto; row-gap: 4px; }
  .cl-settle-arrow { display: none; }
  .cl-settle-row .cl-who:first-child::after { content: " owes"; color: var(--muted); font-weight: 500; }
  .cl-settle-amt { grid-column: 2; grid-row: 1 / span 2; }
}
.cl-ledger { list-style: none; margin: 4px 0 0; padding: 0; }
.cl-ledger-row { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--hair); font-size: 15px; }
.cl-ledger-row:first-child { border-top: 0; }
.cl-chip { font-family: var(--display); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: var(--r-xs); background: var(--pill-bg); color: var(--pill-fg); }
.cl-kind { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: var(--r-xs); }
.cl-kind.is-individual { background: var(--ind-bg); color: var(--ind-fg); }
.cl-kind.is-couple { background: var(--pink); color: var(--tag-pink); }
.cl-up { color: var(--mint); font-weight: 700; }
.cl-down { color: var(--rose); font-weight: 700; }
.cl-nets { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

/* ---------- Footer ---------- */
.cl-foot { margin-top: 36px; padding: 22px; border-radius: var(--r-lg); background: var(--card); box-shadow: 0 1px 0 var(--hair); }
.cl-rules { list-style: none; margin: 8px 0 12px; padding: 0; display: grid; gap: 10px; max-width: 72ch; }
.cl-rules li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; font-size: 15px; }
.cl-rules li > span:first-child { font-size: 17px; line-height: 1.3; }
.cl-bullet { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--c); }
.cl-foot .cl-commish { margin: 16px 0 0; background: var(--bg); box-shadow: none; }

/* ---------- Commissioner tools ---------- */
.cl-commish .cl-weeks { margin-top: 12px; }


/* ---------- Dark mode ---------- */
.cl.is-dark {
  color-scheme: dark;
  --bg: #0D1122;
  --card: #171C31;
  --card-2: #222946;
  --ink: #EEF1FA;
  --muted: #9EA7C3;
  --faint: #69718F;
  --hair: #262D49;
  --ring: #58617F;
  --dash: #3C4461;
  --pill-bg: #EEF1FA;
  --pill-fg: #141A33;
  --pink: #3A1E33;
  --tag-pink: #FF8DBE;
  --ticket: #2B2715;
  --lead-bg: #231F10;
  --lead-glow: #5C4A0E;
  --live-bg: #3A1D24;
  --live-fg: #FF8A8A;
  --ind-bg: #1D2A55;
  --ind-fg: #9DB7FF;
  --pair-bg: rgba(13, 17, 34, 0.55);
  --rose: #FF6B76;
  --mint: #3DDC97;
}
.cl.is-dark .cl-hero { box-shadow: 0 24px 48px -30px rgba(0, 0, 0, 0.9); }
.cl.is-dark .cl-board-row { box-shadow: 0 1px 0 var(--hair), 0 18px 30px -24px var(--c); }
.cl.is-dark .cl-btn.is-primary, .cl.is-dark .cl-wk[aria-pressed="true"] { box-shadow: 0 8px 18px -10px rgba(0, 0, 0, 0.9); }

/* ---------- Theme switch ---------- */
.cl-topbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
.cl-theme {
  display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border: 0; border-radius: var(--r-md);
  background: var(--card); color: var(--ink); box-shadow: 0 1px 0 var(--hair);
  font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
}
.cl-theme-track {
  position: relative; width: 52px; height: 28px; border-radius: var(--r-sm);
  background: #BFE3FF; transition: background-color 0.35s ease;
}
.cl-theme[aria-checked="true"] .cl-theme-track { background: #2A3158; }
.cl-theme-knob {
  position: absolute; top: 3px; left: 3px; display: grid; place-items: center; width: 22px; height: 22px;
  border-radius: var(--r-xs); background: #fff; font-size: 13px; line-height: 1;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); transition: transform 0.45s var(--spring);
}
.cl-theme[aria-checked="true"] .cl-theme-knob { transform: translateX(24px) rotate(360deg); background: #11162B; }
.cl-theme:active .cl-theme-track { transform: scale(0.95); }

@media (max-width: 600px) {
  .cl-wrap { padding: 14px 12px 60px; }
  .cl-hero { padding: 22px 18px 24px; border-radius: var(--r-lg); }
  .cl-ball { font-size: 40px; top: 16px; right: 16px; }
  .cl-tab-full { display: none; }
  .cl-tab-short { display: inline; }
  .cl-board-row { grid-template-columns: auto 1fr auto; column-gap: 10px; padding: 16px 14px 14px; border-radius: var(--r-lg); }
  .cl-board-strip { grid-column: 1 / -1; }
  .cl-board-rec { font-size: 24px; }
  .cl-pip { width: 8px; height: 8px; }
  .cl-pair { padding: 2px 3px; gap: 2px; }
  .cl-strip { gap: 3px; grid-template-columns: repeat(14, minmax(36px, 1fr)); }

  .cl-side.is-right { flex-direction: row; text-align: left; }
  .cl-cplrow { grid-template-columns: auto 1fr auto; }
  .cl-cplres { grid-column: 2 / -1; justify-content: flex-end; }
  .cl-nets { grid-template-columns: 1fr; }
  .cl-pad, .cl-foot { padding: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .cl *, .cl *::before, .cl *::after { animation: none !important; transition: none !important; }
}
