@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800;900&family=Rubik:wght@400;500;600;700&display=swap');

.cl {
  --bg: #F2F6FC;
  --card: #FFFFFF;
  --card-2: #FFFFFF;
  --ink: #141A33;
  --muted: #5D6784;
  --faint: #9AA3B9;
  --hair: #E4E9F2;
  --ring: #A6AFC4;
  --dash: #C8CFDD;
  --pill-bg: #141A33;
  --pill-fg: #FFFFFF;
  --on-sun: #141A33;
  --ticket: #FFF7D6;
  --tag-pink: #B0265F;
  --lead-bg: #FFFBEA;
  --lead-glow: #FFE58A;
  --live-bg: #FFE8E8;
  --live-fg: #C62828;
  --ind-bg: #E1EAFF;
  --ind-fg: #1F4FD1;
  --pair-bg: rgba(255, 255, 255, 0.75);
  --turf: #16934F;
  --turf-deep: #0B6B39;
  --sun: #FFD23F;
  --pink: #FFE0EC;
  --rose: #D93A48;
  --mint: #0E8A55;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --r-lg: 10px;
  --r-md: 8px;
  --r-sm: 6px;
  --r-xs: 4px;
  --display: Unbounded, Rubik, system-ui, sans-serif;
  font-family: Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  color-scheme: light;
  transition: background-color 0.35s ease, color 0.35s ease;
}
.cl *, .cl *::before, .cl *::after { box-sizing: border-box; }
.cl-wrap { max-width: 900px; margin: 0 auto; padding: 24px 18px 80px; }
.cl-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.cl button:focus-visible, .cl input:focus-visible { outline: 3px solid #2F6BFF; outline-offset: 3px; }

.cl-card { background: var(--card); border-radius: var(--r-lg); margin-bottom: 18px; box-shadow: 0 1px 0 var(--hair); }
.cl-pad { padding: 22px; }
.cl-h2 { margin: 0 0 10px; font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
.cl-sub { margin: 4px 0 0; font-size: 14px; color: var(--muted); max-width: 70ch; }

/* ---------- Hero: the field ---------- */
.cl-hero {
  position: relative; overflow: hidden; isolation: isolate;
  padding: 28px 26px 30px; border-radius: var(--r-lg); color: #fff;
  background:
    radial-gradient(110% 90% at 100% 0%, rgba(62, 214, 124, 0.55) 0%, transparent 55%),
    linear-gradient(160deg, var(--turf) 0%, var(--turf-deep) 100%);
  box-shadow: 0 24px 48px -28px rgba(11, 107, 57, 0.9);
}
.cl-hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.11) 0 2px, transparent 2px 74px);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 35%, #000);
  mask-image: linear-gradient(180deg, transparent, #000 35%, #000);
}
.cl-kicker {
  display: inline-block; margin: 0; padding: 5px 12px; border-radius: var(--r-sm);
  background: rgba(255, 255, 255, 0.16); font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.cl-h1 {
  margin: 14px 0 14px; max-width: 11ch;
  font-family: var(--display); font-weight: 800;
  font-size: clamp(44px, 10.5vw, 92px); line-height: 0.95; letter-spacing: -0.035em; color: #fff;
  text-shadow: 0 5px 0 rgba(8, 70, 37, 0.55);
}
.cl-lede { margin: 0; font-size: 17px; font-weight: 500; max-width: 50ch; color: rgba(255, 255, 255, 0.95); }
.cl-updated {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 16px 0 0; padding: 6px 12px 6px 10px; border-radius: var(--r-sm);
  background: var(--sun); color: var(--on-sun); font-size: 13px; font-weight: 600;
}
.cl-updated::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--on-sun); }
.cl-refresh {
  margin-left: 4px; padding: 4px 10px; border: 0; border-radius: var(--r-xs);
  background: rgba(0, 0, 0, 0.14); color: inherit; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
}
.cl-refresh:disabled { opacity: 0.6; cursor: default; }
.cl-offline { margin: 10px 0 0; font-size: 13px; font-weight: 500; color: #FFE9A8; }
.cl-ball {
  position: absolute; top: 20px; right: 24px; font-size: 54px; line-height: 1;
  filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.3));
  animation: cl-kick 1.2s cubic-bezier(0.2, 0.9, 0.25, 1) 0.15s both;
  transition: transform 0.5s var(--spring);
}
.cl-hero:hover .cl-ball { transform: rotate(-18deg) translateY(-4px); }
@keyframes cl-kick {
  0% { transform: translate(-720px, 120px) rotate(-1000deg) scale(0.5); opacity: 0; }
  12% { opacity: 1; }
  100% { transform: none; opacity: 1; }
}

/* ---------- Weekly winner celebration ---------- */
.cl-confetti { position: fixed; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
.cl-flake {
  position: absolute; top: -12vh; object-fit: contain;
  filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.22));
  animation-name: cl-fall; animation-timing-function: linear; animation-fill-mode: both;
}
.cl-flake.is-dot { border-radius: 50%; background: var(--c); }
@keyframes cl-fall {
  0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
  6% { opacity: 1; }
  100% { transform: translate3d(var(--dx), 118vh, 0) rotate(var(--spin)); opacity: 1; }
}
.cl-winner {
  position: relative; display: flex; align-items: center; gap: 16px; margin: 0 0 18px; padding: 16px 44px 16px 18px;
  border-radius: var(--r-lg); background: var(--card);
  box-shadow: 0 0 0 2px var(--c), 0 18px 34px -26px var(--c);
  animation: cl-pop-in 0.6s var(--spring) both;
}
@keyframes cl-pop-in { from { opacity: 0; transform: translateY(-10px) scale(0.97); } to { opacity: 1; transform: none; } }
.cl-winner-faces { display: inline-flex; padding: 0; border: 0; background: none; cursor: pointer; }
.cl-winner-faces .cl-av + .cl-av { margin-left: -14px; }
.cl-winner-faces:active { transform: scale(0.95); }
.cl-winner-copy { min-width: 0; }
.cl-winner-kicker { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.cl-winner-name { margin: 2px 0 4px; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.15; letter-spacing: -0.02em; }
.cl-winner-pts { margin: 0; font-size: 14px; color: var(--muted); }
.cl-winner-x {
  position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border: 0; border-radius: var(--r-xs);
  background: var(--bg); color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer;
}
@media (max-width: 600px) {
  .cl-winner { gap: 12px; padding: 14px 40px 14px 14px; }
  .cl-winner-name { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { .cl-confetti { display: none; } }

/* ---------- Tabs: sliding pill ---------- */
.cl-tabs {
  position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr);
  margin: 22px 0 22px; padding: 5px; border-radius: var(--r-md); background: var(--card); box-shadow: 0 1px 0 var(--hair);
}
.cl-tab-ind {
  position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / var(--n));
  border-radius: var(--r-sm); background: var(--pill-bg);
  transform: translateX(calc(var(--i) * 100%)); transition: transform 0.5s var(--spring);
}
.cl-tab {
  position: relative; z-index: 1; padding: 11px 8px; border: 0; border-radius: var(--r-sm); background: transparent;
  color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: color 0.25s ease;
}
.cl-tab[aria-selected="true"] { color: var(--pill-fg); }
.cl-tab { transition: color 0.25s ease, transform 0.3s var(--spring); }
.cl-tab:active { transform: scale(0.95); }
.cl-tab-short { display: none; }

.cl-view { animation: cl-rise 0.35s var(--spring); }
@keyframes cl-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- Avatars ---------- */
.cl-av {
  display: inline-grid; place-items: center; flex: 0 0 auto; border-radius: 50%;
  background: var(--c); color: var(--fg); font-weight: 700; line-height: 1;
  box-shadow: 0 0 0 2.5px var(--card);
}
.cl-av.is-photo { display: inline-block; object-fit: cover; border: 2px solid var(--c); background: var(--c); }
.cl-duo { position: relative; display: inline-flex; flex: 0 0 auto; }
.cl-duo .cl-av + .cl-av { margin-left: -8px; transition: transform 0.4s var(--spring); }
.cl-duo-heart {
  position: absolute; left: 50%; bottom: -6px; font-size: 12px; line-height: 1;
  transform: translateX(-50%); transition: transform 0.4s var(--spring);
}
.cl-who { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }


/* ---------- The kiss ---------- */
/* At rest the pair sits side by side. On hover or tap they lean in, heads tilted, and a kiss pops up where they meet. */
.cl-duo.is-kiss .cl-av + .cl-av { margin-left: 3px; }
.cl-duo.is-kiss .cl-av { position: relative; transform-origin: 50% 85%; transition: transform 0.5s var(--spring); }
.cl-duo.is-kiss .cl-av:nth-child(1) { z-index: 2; }
.cl-duo.is-kiss .cl-duo-heart { transition: transform 0.3s ease, opacity 0.2s ease; }
.cl-kiss {
  position: absolute; left: 50%; top: -12px; z-index: 3; font-size: 17px; line-height: 1; pointer-events: none;
  opacity: 0; transform: translate(-50%, 8px) scale(0.2) rotate(-20deg);
  transition: opacity 0.15s ease, transform 0.25s ease;
}
.cl-board-row:hover .cl-duo.is-kiss .cl-av:nth-child(1),
.cl-board-row:active .cl-duo.is-kiss .cl-av:nth-child(1) { transform: rotate(18deg) scale(1.04); }
.cl-board-row:hover .cl-duo.is-kiss .cl-av:nth-child(2),
.cl-board-row:active .cl-duo.is-kiss .cl-av:nth-child(2) { transform: rotate(-18deg) scale(1.04); }
.cl-board-row:hover .cl-duo.is-kiss .cl-duo-heart,
.cl-board-row:active .cl-duo.is-kiss .cl-duo-heart { opacity: 0; transform: translate(-50%, 6px) scale(0.5); }
.cl-board-row:hover .cl-kiss,
.cl-board-row:active .cl-kiss {
  opacity: 1; transform: translate(-50%, 0) scale(1) rotate(0deg);
  transition: opacity 0.15s ease 0.18s, transform 0.5s var(--spring) 0.18s;
}

/* ---------- Couples Cup leaderboard ---------- */
.cl-board { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.cl-board-row {
  position: relative; display: grid; grid-template-columns: auto 1fr auto; column-gap: 14px; row-gap: 14px; align-items: center;
  padding: 18px 20px 16px; border-radius: var(--r-lg);
  background: radial-gradient(90% 140% at 100% 0%, var(--soft) 0%, transparent 55%), var(--card);
  box-shadow: 0 1px 0 var(--hair), 0 18px 30px -26px var(--c);
  transition: transform 0.35s var(--spring), box-shadow 0.35s ease;
}
.cl-board-row.is-lead {
  background: radial-gradient(90% 140% at 100% 0%, var(--lead-glow) 0%, transparent 60%), var(--lead-bg);
  box-shadow: 0 0 0 2px var(--sun), 0 22px 36px -24px rgba(214, 160, 0, 0.8);
}
@media (hover: hover) {
  .cl-board-row:hover { transform: translateY(-3px) rotate(-0.4deg); box-shadow: 0 1px 0 var(--hair), 0 26px 40px -24px var(--c); }
}
.cl-trophy { margin-left: 8px; font-size: 18px; }
.cl-board-main { min-width: 0; }
.cl-pts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.cl-live {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: var(--r-xs);
  background: var(--live-bg); color: var(--live-fg); font-size: 12px; font-weight: 600;
}
.cl-live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #FF4545; }
.cl-board-names { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.cl-board-rec { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -0.03em; line-height: 1; }
.cl-board-strip { grid-column: 2 / -1; }

.cl-strip { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; max-width: 540px; }
.cl-strip-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cl-strip-wk { font-size: 10px; font-weight: 500; color: var(--muted); }

.cl-pair { display: inline-flex; gap: 3px; padding: 3px 4px; border-radius: var(--r-xs); vertical-align: middle; }
.cl-pair.is-partners { background: var(--pink); }
.cl-pip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2px var(--ring); }
.cl-pip.pip-W { background: var(--c, var(--turf)); box-shadow: none; }

.cl-pip.pip-none { background: transparent; box-shadow: none; border: 1.5px dashed var(--dash); }

.cl-legend { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 16px; padding: 4px 6px; font-size: 13px; color: var(--muted); }
.cl-legend > span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Week picker ---------- */
.cl-weeks { display: flex; gap: 8px; overflow-x: auto; padding: 6px 4px 10px; margin: 0 -4px 6px; scrollbar-width: none; }

.cl-wk {
  position: relative; flex: 0 0 auto; width: 42px; height: 42px; border-radius: var(--r-md); border: 0;

.cl-status {

}
.cl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dash); }

.cl-dot.is-final { background: var(--turf); }

/* ---------- Bet slips ---------- */
.cl-ticket {
  display: flex; gap: 12px; align-items: center; margin: 4px 0 18px; padding: 12px 16px 12px 12px;

}

}

.cl-gscore { font-family: var(--display); font-weight: 700; font-size: 15px; padding: 3px 9px; border-radius: var(--r-xs); color: var(--muted); }

.cl-tag {
  display: inline-block; margin-left: 8px; padding: 3px 10px; border-radius: var(--r-xs);

.cl-cplweek { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cl-cplrow {
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: var(--r-md); background: var(--soft);

.cl-cplrow .cl-tag { background: var(--card); }
.cl-cplname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

.cl-res { display: inline-block; min-width: 34px; font-weight: 700; text-align: right; }

/* ---------- Tables ---------- */
.cl-table { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 8px; }
.cl-table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px 10px 0; border-bottom: 1px solid var(--hair); }
