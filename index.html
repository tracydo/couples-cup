@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800;900&family=Rubik:wght@400;500;600;700&display=swap');

.cl {
  --bg: #F2F6FC;
  --card: #FFFFFF;
  --card-2: #FFFFFF;
  --ink: #141A33;
  --muted: #5D6784;
  --faint: #9AA3B9;
  --hair: #E4E9F2;
  --ring: #A6AFC4;
  --dash: #C8CFDD;
  --pill-bg: #141A33;
  --pill-fg: #FFFFFF;
  --on-sun: #141A33;
  --ticket: #FFF7D6;
  --tag-pink: #B0265F;
  --lead-bg: #FFFBEA;
  --lead-glow: #FFE58A;
  --live-bg: #FFE8E8;
  --live-fg: #C62828;
  --ind-bg: #E1EAFF;
  --ind-fg: #1F4FD1;
  --pair-bg: rgba(255, 255, 255, 0.75);
  --turf: #16934F;
  --turf-deep: #0B6B39;
  --sun: #FFD23F;
  --pink: #FFE0EC;
  --rose: #D93A48;
  --mint: #0E8A55;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --r-lg: 10px;
  --r-md: 8px;
  --r-sm: 6px;
  --r-xs: 4px;
  --display: Unbounded, Rubik, system-ui, sans-serif;
  font-family: Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  color-scheme: light;
  transition: background-color 0.35s ease, color 0.35s ease;
}
.cl *, .cl *::before, .cl *::after { box-sizing: border-box; }
.cl-wrap { max-width: 900px; margin: 0 auto; padding: 24px 18px 80px; }
.cl-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.cl button:focus-visible, .cl input:focus-visible { outline: 3px solid #2F6BFF; outline-offset: 3px; }

.cl-card { background: var(--card); border-radius: var(--r-lg); margin-bottom: 18px; box-shadow: 0 1px 0 var(--hair); }
.cl-pad { padding: 22px; }
.cl-h2 { margin: 0 0 10px; font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
.cl-sub { margin: 4px 0 0; font-size: 14px; color: var(--muted); max-width: 70ch; }

/* ---------- Hero: the field ---------- */
.cl-hero {
  position: relative; overflow: hidden; isolation: isolate;
  padding: 28px 26px 30px; border-radius: var(--r-lg); color: #fff;
  background:
    radial-gradient(110% 90% at 100% 0%, rgba(62, 214, 124, 0.55) 0%, transparent 55%),
    linear-gradient(160deg, var(--turf) 0%, var(--turf-deep) 100%);
  box-shadow: 0 24px 48px -28px rgba(11, 107, 57, 0.9);
}
.cl-hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.11) 0 2px, transparent 2px 74px);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 35%, #000);
  mask-image: linear-gradient(180deg, transparent, #000 35%, #000);
}
.cl-kicker {
  display: inline-block; margin: 0; padding: 5px 12px; border-radius: var(--r-sm);
  background: rgba(255, 255, 255, 0.16); font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.cl-h1 {
  margin: 14px 0 14px; max-width: 11ch;
  font-family: var(--display); font-weight: 800;
  font-size: clamp(44px, 10.5vw, 92px); line-height: 0.95; letter-spacing: -0.035em; color: #fff;
  text-shadow: 0 5px 0 rgba(8, 70, 37, 0.55);
}
.cl-lede { margin: 0; font-size: 17px; font-weight: 500; max-width: 50ch; color: rgba(255, 255, 255, 0.95); }
.cl-updated {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 16px 0 0; padding: 6px 12px 6px 10px; border-radius: var(--r-sm);
  background: var(--sun); color: var(--on-sun); font-size: 13px; font-weight: 600;
}
.cl-updated::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--on-sun); }
.cl-refresh {
  margin-left: 4px; padding: 4px 10px; border: 0; border-radius: var(--r-xs);
  background: rgba(0, 0, 0, 0.14); color: inherit; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
}
.cl-refresh:disabled { opacity: 0.6; cursor: default; }
